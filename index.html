<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("bv.theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>BursaViz — acțiunile de la BVB</title>
    <meta name="description" content="Hartă a pieței, screener, grafice, indicatori și știri pentru acțiunile de la Bursa de Valori București. Date cu întârziere, fără cont." />
